# VipGroup studio on the office PC. From the repo root: `docker compose up -d --build`, then
# http://localhost:3000 (or http://<pc-ip>:3000 on the office network). README: "Run the studio
# with Docker". Needs POSTGRES_PASSWORD in the repo's .env (see .env.example).
name: vipgroup

services:
  studio:
    build: .
    image: vipgroup-studio
    # Starts again after a crash and when Docker Desktop starts with Windows (replaces pm2).
    restart: unless-stopped
    ports:
      - "3000:3000"
    # R2 keys, GOEXPERIENCE_URL… from the repo's .env, read when the container starts.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container: these win over any Windows path set in .env.
      STORAGE_DIR: /data
      FLIPBOOKS_DIR: /data/flipbooks
      # The library (folders, books) is in the postgres service; pg reads these variables.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vipgroup
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      PGDATABASE: vipgroup
    volumes:
      # The converted books and the uploads. Kept when the container is rebuilt.
      - studio-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No `ports`: only the studio reaches the database, on Compose's own network.
    environment:
      POSTGRES_USER: vipgroup
      POSTGRES_DB: vipgroup
      # Used when the database is first created; changing it later does not change it there.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipgroup -d vipgroup"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging

volumes:
  studio-data:
  postgres-data:
