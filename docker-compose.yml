# VipGroup studio on the office PC. From the repo root: `docker compose up -d --build`, then
# https://studio.vipgroup.lan (README: "Run the studio with Docker" and "HTTPS on the office
# network"). Needs POSTGRES_PASSWORD in the repo's .env (see .env.example).
name: vipgroup

services:
  studio:
    build: .
    image: vipgroup-studio
    # Starts again after a crash and when Docker Desktop starts with Windows (replaces pm2).
    restart: unless-stopped
    # Not opened on the network: the "https" service is the only way in.
    expose:
      - "3000"
    # R2 keys, GOEXPERIENCE_URL… from the repo's .env, read when the container starts.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container: these win over any Windows path set in .env.
      STORAGE_DIR: /data
      FLIPBOOKS_DIR: /data/flipbooks
      # The library (folders, books) is in the postgres service; pg reads these variables.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vipgroup
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      PGDATABASE: vipgroup
    volumes:
      # The converted books and the uploads. Kept when the container is rebuilt.
      - studio-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No `ports`: only the studio reaches the database, on Compose's own network.
    environment:
      POSTGRES_USER: vipgroup
      POSTGRES_DB: vipgroup
      # Used when the database is first created; changing it later does not change it there.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipgroup -d vipgroup"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging

  # Once: creates the studio's own certificate authority in the `ca` volume (https/make-ca.sh),
  # then exits. Later starts only write the download page again.
  ca:
    build: ./https
    image: vipgroup-ca
    environment:
      STUDIO_HOST: ${STUDIO_HOST:-studio.vipgroup.lan}
    volumes:
      - ca:/ca

  # HTTPS for the office network: https://studio.vipgroup.lan → studio; http:// → redirect,
  # except /certificat (the page to install the certificate on each PC).
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_HOST: ${STUDIO_HOST:-studio.vipgroup.lan}
    volumes:
      - ./https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ca:/ca:ro
      - caddy-data:/data
    depends_on:
      ca:
        condition: service_completed_successfully
      studio:
        condition: service_healthy
    logging: *logging

volumes:
  studio-data:
  postgres-data:
  # The certificate authority: losing it means installing a new certificate on every PC.
  ca:
  # Caddy's own state (the site certificates it issued and renews).
  caddy-data:
